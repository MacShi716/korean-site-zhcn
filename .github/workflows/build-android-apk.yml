name: Build Android APK

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile-android/package-lock.json

      - name: Run the web regression tests
        run: node --test tests/*.mjs auth/tests/*.js

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$ANDROID_HOME" ]; then
            echo "This runner does not expose ANDROID_HOME or ANDROID_SDK_ROOT." >&2
            exit 1
          fi
          if ! command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
            if [ -z "$SDKMANAGER" ]; then
              echo "sdkmanager was not found under $ANDROID_HOME" >&2
              exit 1
            fi
            export PATH="$(dirname "$SDKMANAGER"):$PATH"
          fi
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install icon tooling
        run: sudo apt-get update && sudo apt-get install -y python3-pil

      - name: Install the Android shell
        working-directory: mobile-android
        run: npm ci

      - name: Regenerate icons, test the sync, and copy the static site
        working-directory: mobile-android
        run: |
          python3 scripts/generate-icons.py
          npm test
          npm run sync

      - name: Assemble the debug APK
        working-directory: mobile-android/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify the signature and the bundled site
        working-directory: mobile-android
        run: node scripts/verify-apk.mjs android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: korean-study-v1.0.0-debug
          path: mobile-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish or update the android-latest release
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp mobile-android/android/app/build/outputs/apk/debug/app-debug.apk korean-study-v1.0.0-debug.apk
          printf '%s\n' \
            'Debug APK for the Korean learning site. The static pages, question banks, dictionary, and voices/ audio are packaged inside the app and load from https://localhost, so the lessons work offline.' \
            '' \
            'Install it by allowing unknown sources. The debug key signs the APK with JAR v1 and APK Signature Scheme v2. Android 11 and newer install it using the v2 signature.' \
            '' \
            'Online-only pieces stay online: the museum video stream and Supabase email login. Email confirmation, password reset, and OAuth do not return into the app. This workflow does not add a native OAuth callback.' \
            > release-notes.txt
          gh release delete android-latest --yes --cleanup-tag || true
          sleep 2
          gh release create android-latest \
            --target "${{ github.sha }}" \
            --title "韩语学习 Android 1.0.0 debug" \
            --notes-file release-notes.txt \
            korean-study-v1.0.0-debug.apk
