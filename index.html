<!DOCTYPE html>
<!-- 国内版初稿 2026-11-18：面向中国大陆用户的页面与核心学习流程。等他看过再改；不要替换现有 index.html。这是国内版初稿的预览。目前仍是初稿，不会替换现有网站。以英+韩待发布稿为底复制改，未写入第4节新词条。 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a5f4a">
<title>동행 · Together · 同行</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root {
  --bg: #f6f3ee;
  --surface: #ffffff;
  --ink: #1a1a1a;
  --muted: #6b6b6b;
  --border: #e2ddd4;
  --primary: #1a5f4a;
  --primary-soft: #e6f2ed;
  --accent: #c45c26;
  --accent-soft: #fbeee6;
  --danger: #b33a3a;
  --danger-soft: #fceaea;
  --ok: #1a7a4c;
  --ok-soft: #e6f5ed;
  --shadow: 0 2px 12px rgba(26,40,30,.08);
  --radius: 14px;
  --tap: 44px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", "Noto Sans SC", "PingFang SC", "Apple SD Gothic Neo", sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.5; min-height: 100%; }
body { padding-bottom: calc(72px + env(safe-area-inset-bottom)); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }
a { color: var(--primary); }

.app-header {
  position: sticky; top: 0; z-index: 40;
  background: rgba(246,243,238,.92); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
  padding: 10px 14px 8px;
}
.header-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.brand { font-weight: 700; font-size: 1.05rem; color: var(--primary); letter-spacing: -.02em; }
.brand small { display: block; font-weight: 500; font-size: .7rem; color: var(--muted); letter-spacing: 0; }
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 6px 10px; border-radius: 999px; border: 1px solid var(--border);
  background: var(--surface); font-size: .8rem; min-height: 32px;
}
.chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.chip.soft.active { background: var(--primary-soft); color: var(--primary); border-color: #b7d5c8; }

.main { max-width: 720px; margin: 0 auto; padding: 14px 14px 24px; }
.panel { display: none; }
.panel.active { display: block; }

.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow);
}
.card h2 { margin: 0 0 8px; font-size: 1.05rem; }
.card h3 { margin: 0 0 6px; font-size: .95rem; }
.muted { color: var(--muted); font-size: .85rem; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.space { justify-content: space-between; }
.grow { flex: 1; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: var(--tap); padding: 10px 16px; border-radius: 12px;
  background: var(--primary); color: #fff; font-weight: 600; font-size: .92rem;
  border: 1px solid transparent; touch-action: manipulation;
}
.btn:active { transform: scale(.98); }
.btn.secondary { background: var(--surface); color: var(--ink); border-color: var(--border); }
.btn.ghost { background: transparent; color: var(--primary); border-color: transparent; min-height: 36px; padding: 6px 10px; }
.btn.danger { background: var(--danger); }
.btn.accent { background: var(--accent); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; }

.field { margin-bottom: 10px; }
.field label { display: block; font-size: .8rem; color: var(--muted); margin-bottom: 4px; }
.field input, .field select, .field textarea {
  width: 100%; padding: 12px 12px; border-radius: 12px; border: 1px solid var(--border);
  background: #fff; min-height: var(--tap);
}
.field textarea { min-height: 90px; resize: vertical; }

.badge {
  display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: .72rem; font-weight: 600;
  background: var(--primary-soft); color: var(--primary);
}
.badge.reg-daily { background: #eef6ea; color: #3a6b2e; }
.badge.reg-written { background: #eef0f8; color: #3a4570; }
.badge.reg-news { background: #f8eee8; color: #7a3e1e; }
.badge.diff { background: #f3f0ea; color: #5a5348; }
.badge.hanja { background: #f5f0e6; color: #6a5430; font-family: "Noto Serif SC", "Songti SC", serif; }

.ko-big { font-size: 1.65rem; font-weight: 700; letter-spacing: -.02em; line-height: 1.3; }
.meaning { margin-top: 4px; }
.meaning .en { color: #2c4a6e; }
.meaning .zh { color: #6a3a2a; }
.gloss-hanja { font-family: "Noto Serif SC", "Songti SC", serif; color: #6a5430; }
.gloss-roma { color: #5a5348; font-style: italic; letter-spacing: .02em; }
.chip.gloss-speak { min-height: 28px; padding: 2px 8px; font-size: .8rem; vertical-align: middle; cursor: pointer; }
.example { margin-top: 10px; padding: 10px; background: var(--bg); border-radius: 10px; font-size: .92rem; }
.example-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.compose-word-list { display: grid; gap: 8px; max-height: 50vh; overflow: auto; margin-top: 8px; }
.compose-word {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 8px 10px; border: 1px solid var(--border); border-radius: 10px;
  background: #fff; cursor: pointer; text-align: left; width: 100%;
}
.compose-word input { margin-top: 4px; flex: 0 0 auto; }
.compose-word.selected { border-color: var(--primary); background: var(--primary-soft); }
.compose-word .ko-form { font-weight: 700; margin-right: 6px; }
.compose-hint-soft { color: var(--accent); font-size: .9rem; margin-top: 8px; }
.compose-meta { font-size: .8rem; color: var(--muted); }
.dict-pager { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:10px; }
.dict-credit { font-size:.85rem; color:var(--muted); margin-top:10px; }
.dict-credit a { color:var(--primary); }

.reveal-zone { position: relative; }
.reveal-mask {
  position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,.95));
  border-radius: 10px; display: flex; align-items: center; justify-content: center;
  font-weight: 600; color: var(--primary); cursor: pointer; backdrop-filter: blur(3px);
}
.reveal-mask.hidden { display: none; }

.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.filters select, .filters input[type="number"] {
  padding: 8px 10px; border-radius: 10px; border: 1px solid var(--border); background: #fff; min-height: 40px;
}

.quiz-prompt { text-align: center; padding: 18px 8px; }
.quiz-prompt .ko-big { font-size: 2rem; }
.choices { display: grid; gap: 8px; }
.choice {
  text-align: left; padding: 14px; border-radius: 12px; border: 1px solid var(--border);
  background: #fff; min-height: var(--tap); font-size: .95rem;
}
.choice.correct { background: var(--ok-soft); border-color: var(--ok); }
.choice.wrong { background: var(--danger-soft); border-color: var(--danger); }
.choice:disabled { opacity: 1; }

.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
  background: rgba(255,255,255,.94); backdrop-filter: blur(12px);
  border-top: 1px solid var(--border);
  padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
  display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px;
}
.nav button {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; padding: 6px 2px; min-height: 52px; font-size: .62rem; color: var(--muted); border-radius: 10px;
}
.nav button .ico { font-size: 1.15rem; line-height: 1; }
.nav button.active { color: var(--primary); background: var(--primary-soft); font-weight: 700; }

.empty { text-align: center; padding: 28px 12px; color: var(--muted); }
.toast {
  position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%);
  background: #222; color: #fff; padding: 10px 16px; border-radius: 999px;
  font-size: .85rem; z-index: 100; opacity: 0; pointer-events: none; transition: opacity .2s;
  max-width: 90vw;
}
.toast.show { opacity: 1; }

.mistake-item { border-left: 4px solid var(--accent); }
.progress-bar { height: 8px; background: var(--border); border-radius: 999px; overflow: hidden; margin: 8px 0; }
.progress-bar > span { display: block; height: 100%; background: var(--primary); width: 0%; transition: width .25s; }

.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.seg button { padding: 8px 12px; min-height: 36px; background: #fff; font-size: .8rem; }
.seg button.active { background: var(--primary); color: #fff; }

.placeholder-box {
  text-align: center; padding: 40px 16px; background: var(--surface); border: 2px dashed var(--border);
  border-radius: var(--radius); color: var(--muted);
}
.placeholder-box strong { color: var(--ink); display: block; font-size: 1.1rem; margin-bottom: 6px; }

.dict-input { font-size: 1.2rem; letter-spacing: .04em; }
.result-ok { color: var(--ok); font-weight: 700; }
.result-bad { color: var(--danger); font-weight: 700; }

@media (min-width: 640px) {
  .nav { max-width: 720px; left: 50%; transform: translateX(-50%); border-radius: 16px 16px 0 0; }
  .choices { grid-template-columns: 1fr 1fr; }
}

/* —— Translate / Conversation (new) —— */
.main.wide-translate { max-width: 1100px; }
.tr-setup .choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tr-setup .choice-grid .chip { justify-content: center; min-height: 40px; }
.tr-sides { display: flex; flex-direction: column; gap: 12px; }
.tr-side {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; min-height: 0;
}
.tr-side-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.tr-side-title { font-weight: 700; color: var(--primary); }
.tr-compose { display: flex; flex-direction: column; gap: 8px; }
.tr-compose textarea {
  width: 100%; min-height: 72px; padding: 12px; border-radius: 12px; border: 1px solid var(--border);
  background: #fff; resize: vertical;
}
.tr-compose .row { gap: 8px; }
.tr-feed { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; max-height: 48vh; overflow: auto; }
.tr-card {
  border: 1px solid var(--border); border-radius: 12px; background: #faf8f5; padding: 10px;
}
.tr-card-grid { display: flex; flex-direction: column; gap: 8px; }
.tr-orig { font-size: 1.05rem; font-weight: 600; white-space: pre-wrap; word-break: break-word; }
.tr-trans {
  min-height: 44px; padding: 10px; border-radius: 10px; background: var(--primary-soft);
  color: var(--muted); font-size: .92rem; white-space: pre-wrap; word-break: break-word;
}
.tr-roma { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .82rem; color: #3a5a4a; }
.tr-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tr-actions .chip { min-height: 32px; font-size: .75rem; }
.tr-fav-list .tr-card { margin-bottom: 8px; }
.tr-mic.recording { background: var(--danger); color: #fff; border-color: var(--danger); }
@media (min-width: 900px) {
  .tr-sides { flex-direction: row; align-items: stretch; }
  .tr-side { flex: 1; min-width: 0; }
  .tr-card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
  .tr-feed { max-height: 56vh; }
}

/* —— Left sidebar nav —— */
body { padding-bottom: 0; }
.nav {
  position: fixed; top: 0; bottom: 0; left: 0; right: auto; width: 200px; z-index: 60;
  max-width: none; transform: none; border-radius: 0;
  border-top: none; border-right: 1px solid var(--border);
  padding: 14px 10px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto;
}
.nav button {
  flex-direction: row; justify-content: flex-start; gap: 10px;
  padding: 10px 12px; min-height: 44px; font-size: .92rem; text-align: left; width: 100%;
}
.nav-toggle { display: none; font-size: 1.3rem; min-width: 40px; min-height: 40px; border-radius: 10px; }
.nav-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 55; }
@media (min-width: 900px) {
  body { padding-left: 200px; }
}
@media (max-width: 899px) {
  .nav-toggle { display: inline-flex; align-items: center; justify-content: center; }
  .nav { transform: translateX(-100%); transition: transform .2s; box-shadow: 2px 0 16px rgba(0,0,0,.12); }
  body.nav-open .nav { transform: translateX(0); }
  body.nav-open .nav-backdrop { display: block; }
}

/* —— AI Chat —— */
.main.wide-ai { max-width: 1100px; }
.ai-layout { display: flex; flex-direction: column; gap: 12px; }
.ai-notice {
  padding: 10px 12px; border-radius: 12px; background: var(--accent-soft);
  border: 1px solid #efc9b0; color: #7a3e1e; font-size: .88rem;
}
.ai-filter-panel {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 12px; box-shadow: var(--shadow);
}
.ai-filter-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.ai-filter-head h3 { margin: 0; font-size: .95rem; }
.ai-filter-section { margin: 10px 0 4px; }
.ai-filter-label {
  display: flex; align-items: center; gap: 8px; margin: 8px 0 6px;
  font-size: .72rem; color: var(--muted); text-transform: none; letter-spacing: .02em;
}
.ai-filter-label::before, .ai-filter-label::after {
  content: ''; flex: 1; height: 1px; background: var(--border);
}
.ai-filter-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.ai-filter-chips .chip { min-height: 30px; font-size: .78rem; }
.ai-filter-chips .chip.active.all-vendors { color: #7c5cff; background: #ece8ff; border-color: #d4ccff; }
.ai-filter-chips .chip.active.all-groups { color: #1a7a4c; background: var(--ok-soft); border-color: #b7e0c8; }
.ai-filter-chips .chip.active.all-billing { color: #c45c26; background: var(--accent-soft); border-color: #efc9b0; }
.ai-filter-chips .chip.active.all-tags { color: #b33a6a; background: #fce8f0; border-color: #f0c4d4; }
.ai-filter-chips .chip.active.all-endpoints { color: #2a8a6a; background: #e6f5ef; border-color: #b7e0d0; }
.ai-model-list { display: grid; gap: 8px; margin-top: 10px; }
.ai-model-card {
  text-align: left; width: 100%; padding: 12px; border-radius: 12px;
  border: 1px solid var(--border); background: #fff; min-height: 56px;
}
.ai-model-card.active { border-color: var(--primary); background: var(--primary-soft); }
.ai-model-card .name { font-weight: 700; font-size: .95rem; }
.ai-model-card .meta { font-size: .78rem; color: var(--muted); margin-top: 2px; }
.ai-model-card .price { font-size: .75rem; color: #7a3e1e; margin-top: 4px; }
.ai-chat-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; min-height: 420px;
}
.ai-chat-toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
.ai-chat-toolbar .model-tag { font-size: .8rem; color: var(--muted); }
.ai-msgs {
  flex: 1; overflow: auto; max-height: 48vh; display: flex; flex-direction: column; gap: 10px;
  padding: 8px 2px; background: var(--bg); border-radius: 12px; border: 1px solid var(--border);
  min-height: 220px;
}
.ai-msg {
  max-width: 92%; padding: 10px 12px; border-radius: 14px; white-space: pre-wrap; word-break: break-word;
  font-size: .92rem; position: relative;
}
.ai-msg.user { align-self: flex-end; background: var(--primary); color: #fff; border-bottom-right-radius: 4px; }
.ai-msg.assistant { align-self: flex-start; background: #fff; border: 1px solid var(--border); border-bottom-left-radius: 4px; }
.ai-msg.system { align-self: center; background: transparent; color: var(--muted); font-size: .82rem; max-width: 100%; text-align: center; }
.ai-msg .ai-msg-actions { margin-top: 6px; display: flex; gap: 4px; }
.ai-msg.user .ai-msg-actions .chip { background: rgba(255,255,255,.18); color: #fff; border-color: rgba(255,255,255,.35); }
.ai-compose { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.ai-compose textarea {
  width: 100%; min-height: 72px; padding: 12px; border-radius: 12px; border: 1px solid var(--border);
  background: #fff; resize: vertical;
}
.ai-empty { text-align: center; color: var(--muted); padding: 28px 12px; font-size: .9rem; }
@media (min-width: 900px) {
  .ai-layout { display: grid; grid-template-columns: 320px 1fr; gap: 14px; align-items: start; }
  .ai-filter-panel { position: sticky; top: 70px; max-height: calc(100vh - 90px); overflow: auto; }
  .ai-msgs { max-height: 56vh; }
}

/* —— Auth gate + draft badge (国内版初稿演示) —— */
.draft-badge {
  display: inline-block; padding: 2px 8px; border-radius: 999px;
  font-size: .68rem; font-weight: 600; line-height: 1.4;
  background: var(--accent-soft); color: var(--accent);
  vertical-align: middle;
}
.brand .draft-badge { margin-left: 6px; }
.auth-gate {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(15, 23, 20, .45);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 28px 16px 40px;
  overflow: auto;
}
.auth-gate[hidden] { display: none !important; }
.auth-card { width: 100%; max-width: 420px; margin: 0; position: relative; }
.auth-card .row input {
  flex: 1; min-width: 0; min-height: var(--tap);
  padding: 12px; border-radius: 12px; border: 1px solid var(--border); background: #fff;
}
.auth-close {
  position: absolute; top: 10px; right: 10px; min-width: 36px; min-height: 36px;
  border-radius: 10px; border: 1px solid var(--border); background: #fff; font-size: 1rem; cursor: pointer;
}
.phone-row { display: flex; gap: 8px; align-items: stretch; }
.phone-row select {
  flex: 0 0 auto; max-width: 46%; min-height: var(--tap);
  padding: 10px 8px; border-radius: 12px; border: 1px solid var(--border); background: #fff;
}
.phone-row input { flex: 1; min-width: 0; }
.social-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 8px; }
.social-row .btn { padding-left: 6px; padding-right: 6px; font-size: .85rem; }
.auth-divider { text-align: center; color: var(--muted); font-size: .8rem; margin: 14px 0 4px; }
.auth-foot { margin-top: 14px; font-size: .72rem; color: var(--muted); text-align: center; opacity: .85; }
.header-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.auth-top-btn {
  min-height: 34px; padding: 4px 10px; border-radius: 10px; font-size: .8rem; font-weight: 600;
  border: 1px solid var(--border); background: #fff; color: var(--primary); cursor: pointer; white-space: nowrap;
}
.auth-top-btn.signed { background: var(--accent-soft); color: var(--accent); }
body.auth-locked { overflow: hidden; }

/* —— Modest motion (CSS only; no CDN libs) —— */
.panel.active { animation: panel-enter .28s ease; }
@keyframes panel-enter {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}
.nav button {
  position: relative;
  transition: background-color .15s ease, color .15s ease, box-shadow .15s ease;
}
.nav button:hover { background: var(--primary-soft); color: var(--primary); }
.nav button.active { box-shadow: inset 3px 0 0 var(--primary); }
.nav-sep {
  height: 1px; margin: 8px 8px; background: var(--border); flex-shrink: 0;
}
@media (hover: hover) {
  .card {
    transition: box-shadow .2s ease, transform .2s ease, border-color .2s ease;
  }
  .card:hover {
    box-shadow: 0 4px 16px rgba(26,40,30,.12);
    transform: translateY(-1px);
  }
}
.btn { transition: transform .15s ease, box-shadow .15s ease, filter .15s ease; }
@media (hover: hover) {
  .btn:hover:not(:disabled) {
    box-shadow: 0 2px 8px rgba(26,95,74,.22);
    filter: brightness(1.04);
  }
  .btn.secondary:hover:not(:disabled),
  .btn.ghost:hover:not(:disabled) {
    box-shadow: 0 1px 6px rgba(26,40,30,.08);
    filter: none;
    background: var(--primary-soft);
  }
}
.feat-row {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px;
  width: 100%; padding: 10px 12px; margin: 0 0 6px; border-radius: 10px;
  border: 1px solid var(--border); background: #fbfaf7;
}
.feat-row:last-child { margin-bottom: 0; }
.feat-row .feat-text { flex: 1 1 180px; }
.feat-jumps { display: flex; flex-wrap: wrap; gap: 6px; }

function t(key) {
  const lang = state.uiLang || 'zh';
  const pack = I18N[lang] || I18N.zh;
  return pack[key] != null ? pack[key] : (I18N.en[key] || key);
}
function tf(key, vars) {
  let s = t(key);
  Object.keys(vars || {}).forEach(k => { s = s.replace('{'+k+'}', vars[k]); });
  return s;
}

function sanitizeKoVoiceChoice(raw) {
  const c = (raw && typeof raw === 'object') ? raw : {};
  const engine = c.engine === 'device' ? 'device' : 'supertonic';
  let sid = parseInt(c.sid, 10);
  if (!(sid >= 0 && sid <= 9)) sid = 0;
  return { engine: engine, sid: sid };
}
function migrateKoVoiceChoice(parsed) {
  const raw = parsed && parsed.koVoiceChoice;
  if (parsed && parsed.koVoiceDefaultV === 2) return sanitizeKoVoiceChoice(raw);
  // v1 默认是本机朗读；把旧默认迁到 Supertonic。已选 Supertonic 的保留说话人。
  if (raw && raw.engine === 'supertonic') return sanitizeKoVoiceChoice(raw);
  return sanitizeKoVoiceChoice({ engine: 'supertonic', sid: 0 });
}

function ccInfo(cc) { return COUNTRY_CODES.find(c => c.cc === cc) || COUNTRY_CODES[0]; }
// 返回 { ok, national }：national 为去掉前导 0 的国内号码
function normalizePhone(cc, raw) {
  const info = ccInfo(cc);
  const digits = String(raw || '').replace(/[\s\-().]/g, '');
  if (!/^\d+$/.test(digits) || !info.re.test(digits)) return { ok:false, national:'' };
  const national = (cc === '+86' || cc === '+1' || cc === '+852' || cc === '+853' || cc === '+65') ? digits : digits.replace(/^0/, '');
  return { ok:true, national };
}
function maskPhone(cc, national) {
  const n = String(national || '');
  const masked = n.length > 6 ? n.slice(0, 3) + '****' + n.slice(-3) : n;
  return cc + ' ' + masked;
}

function loginWithDemoCode(cc, phone, code) {
  // 兼容旧调用 loginWithDemoCode(phone, code)
  if (code === undefined) { code = phone; phone = cc; cc = DEFAULT_CC; }
  const p = String(phone || '').trim();
  const c = String(code || '').trim();
  if (!p) return { ok:false, error: t('authNeedPhone') };
  const norm = normalizePhone(cc, p);
  const info = ccInfo(cc);
  if (!norm.ok) return { ok:false, error: tf('authBadPhone', { c: t(info.key) + ' ' + info.cc, ex: info.ex }) };
  if (!c) return { ok:false, error: t('authNeedCode') };
  if (c !== DEMO_SMS_CODE) return { ok:false, error: t('authBadCode') };
  const id = 'phone' + info.cc.replace('+', '') + '_' + norm.national;
  const now = new Date().toISOString();
  const isNew = !accounts.accounts[id];
  const wasGuest = !accounts.current;
  const guestSnapshot = wasGuest ? JSON.parse(JSON.stringify(state)) : null;
  if (isNew) {
    // 只存注册信息：方式、区号、号码、时间。不存验证码、不存密钥。
    accounts.accounts[id] = { id, method:'phone', cc: info.cc, phone: norm.national, createdAt: now, lastLoginAt: now };
  } else {
    accounts.accounts[id].lastLoginAt = now;
  }
  saveState();
  accounts.current = id;
  saveAccounts();
  if (isNew) {
    // 新账号：把当前游客进度复制一份带进来（游客那份保留不动）
    const base = guestSnapshot || defaultState();
    state = Object.assign(defaultState(), base);
  } else {
    state = loadState();
  }
  state.auth = { signedIn:true, mode:'phone', phone: maskPhone(info.cc, norm.national), at: now };
  applyKoVoiceEngine();
  saveState();
  if (window.__koreanSite) window.__koreanSite.state = state;
  closeAuthPanel();
  renderAll();
  toast(isNew ? t('authRegistered') : t('authWelcomeBack'));
  return { ok:true, isNew, id };
}

/********************
 * Mistake log helpers
 ********************/
function detectWrongPart(typed, correct) {
  typed = (typed||'').replace(/\s+/g,'').normalize('NFC');
  correct = (correct||'').replace(/\s+/g,'').normalize('NFC');
  if (!typed) return 'unknown';
  // Irregular pronoun+particle pairs (나/내, 저/제, 너/네)
  const irregPairs = [
    ['나','내가'],['나','나는'],['내','내가'],
    ['저','제가'],['저','저는'],['제','제가'],
    ['너','네가'],['너','너는'],['네','네가'],['너','니가'],
  ];
  for (const [a,b] of irregPairs) {
    if ((typed===a && correct===b) || (typed===b && correct===a)) return 'particle';
  }
  const particles = ['은','는','이','가','을','를','와','과','도','만','에','에서','으로','로','의','께','께서','한테','에게','께'];
  for (const p of particles) {
    if (correct.endsWith(p) && typed === correct.slice(0, -p.length)) return 'particle';
    if (typed.endsWith(p) && correct === typed.slice(0, -p.length)) return 'particle';
    if (correct.endsWith(p) && typed.endsWith(p) && correct.slice(0,-p.length) !== typed.slice(0,-p.length)) {
      return 'syllable';
    }
  }
  // Longer endings first
  const endings = ['습니다','ㅂ니다','이에요','예요','세요','어요','아요','해요','었어','았어','했어','겠다','네요','니다','요'];
  for (const e of endings) {
    if (correct.endsWith(e) || typed.endsWith(e)) {
      const cBase = correct.endsWith(e) ? correct.slice(0,-e.length) : correct;
      const tBase = typed.endsWith(e) ? typed.slice(0,-e.length) : typed;
      if (cBase === tBase && correct !== typed) return 'ending';
      if (correct.endsWith(e) && !typed.endsWith(e) && typed === cBase) return 'ending';
      if (typed.endsWith(e) && !correct.endsWith(e) && correct === tBase) return 'ending';
      if (correct.endsWith(e) && typed.endsWith(e) && cBase !== tBase) return 'syllable';
    }
  }
  if (Math.abs(typed.length - correct.length) <= 2) return 'syllable';
  return 'other';
}

function recordMistake(itemId, stage, part, typed, correct) {
  if (!state.mistakes[itemId]) {
    state.mistakes[itemId] = { count:0, stages:{}, parts:{}, lastAt:null, lastStage:null, lastPart:null, lastTyped:null, lastCorrect:null };
  }
  const m = state.mistakes[itemId];
  m.count += 1;
  m.stages[stage] = (m.stages[stage]||0) + 1;
  const p = part || detectWrongPart(typed, correct);
  m.parts[p] = (m.parts[p]||0) + 1;
  m.lastAt = new Date().toISOString();
  m.lastStage = stage;
  m.lastPart = p;
  m.lastTyped = typed || null;
  m.lastCorrect = correct || null;
  saveState();
  return p;
}

function setMistakePart(itemId, part) {
  const m = state.mistakes[itemId];
  if (!m) return;
  // adjust counts best-effort
  if (m.lastPart && m.parts[m.lastPart]) {
    m.parts[m.lastPart] = Math.max(0, m.parts[m.lastPart]-1);
  }
  m.parts[part] = (m.parts[part]||0) + 1;
  m.lastPart = part;
  saveState();
}

/********************
 * TTS
 * 韩语朗读入口：speakKo（词卡/例句/选词造句/听写）、speakText（翻译对话，韩语走 speakKo）。

 *   2) 若当前选中的引擎 KO_VOICE_ENGINE.play(text) 成功（同步或异步），则由该引擎播放；
 *   3) 否则用本机 speechSynthesis 兜底，语速 KO_TTS_RATE（略慢、更清楚）。
 * 选项在设置页「韩语朗读音色」中切换，按账号写入 localStorage（游客也用自己的钥匙）；默认开源模型 Supertonic，失败回退本机朗读。
 * 开源模型（Supertonic 3）按需从相对路径 voices/supertonic/ 加载，不进首屏、不打进本 HTML。
 ********************/
let koVoice = null;
let voicesReady = false;
let koAudioEl = null;
const KO_TTS_RATE = 0.72;
const KO_AUDIO_MANIFEST = {};
const KO_VOICE_ENGINE = {
  id: 'device',
  // 换音色时实现 play(text)，成功播放则返回 true（或成功的 Promise）；返回假值或未实现则走下面的兜底。
  play: null

const KO_VOICE_ASSET_BASE = 'voices/supertonic/';
const KO_VOICE_WORKER_REL = KO_VOICE_ASSET_BASE + 'supertonic-worker.js';
const KO_VOICE_ENGINES = [
  { id: 'device', enabled: true },
  { id: 'supertonic', enabled: true, speakers: 10, assetBase: KO_VOICE_ASSET_BASE },
  { id: 'piper', enabled: false, reasonKey: 'koVoicePiperWhy' },
  { id: 'kokoro', enabled: false, reasonKey: 'koVoiceKokoroWhy' },
  { id: 'cosyvoice', enabled: false, reasonKey: 'koVoiceCosyWhy' }
];
let koEngineAudioCtx = null;
let koEngineSource = null;
let supertonicWorker = null;
let supertonicReady = null;
let supertonicReadyFlag = false;

function siteAsset(relPath) {
  const rel = String(relPath || '').replace(/^\//, '');
  try {
    return new URL(rel, new URL('.', location.href)).href;
  } catch (e) {
    const path = (location.pathname || '/');
    const dir = path.endsWith('/') ? path : path.replace(/[^/]*$/, '') || '/';
    return dir + rel;
  }
}
function stopKoEngineAudio() {
  if (koEngineSource) {
    try { koEngineSource.stop(); } catch (e) {}
    koEngineSource = null;
  }
}
function stopKoAudio() {
  stopKoEngineAudio();
  if (koAudioEl) {
    try { koAudioEl.pause(); koAudioEl.removeAttribute('src'); koAudioEl.load(); } catch (e) {}
    koAudioEl = null;
  }
}
function playStaticKo(text, onFail) {
  const rel = KO_AUDIO_MANIFEST[text];
  if (!rel) { onFail(); return; }
  stopKoAudio();
  if (window.speechSynthesis) { try { speechSynthesis.cancel(); } catch (e) {} }
  const a = new Audio(siteAsset(rel));
  koAudioEl = a;
  const fail = function () { if (koAudioEl === a) { stopKoAudio(); onFail(); } };
  a.addEventListener('error', fail);
  const p = a.play();
  if (p && p.catch) p.catch(fail);
}

function refreshVoices() {
  const voices = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  koVoice = voices.find(v => /^ko(-|_)/i.test(v.lang) || /korean/i.test(v.name)) || null;
  voicesReady = true;
  return koVoice;
}

}

function speakKoFallback(text) {

    toast(t('noKoVoice'));

  }

function setKoVoiceStatus(msg) {
  const el = document.getElementById('s-ko-status');
  if (el) el.textContent = msg || '';
}
function playPcmSamples(samples, sampleRate) {
  return new Promise(function (resolve, reject) {
    stopKoAudio();
    if (window.speechSynthesis) { try { speechSynthesis.cancel(); } catch (e) {} }
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) { reject(new Error('no AudioContext')); return; }
    if (!koEngineAudioCtx) koEngineAudioCtx = new Ctx();
    const ctx = koEngineAudioCtx;
    const go = function () {
      try {
        const buf = ctx.createBuffer(1, samples.length, sampleRate || 44100);
        buf.getChannelData(0).set(samples);
        const src = ctx.createBufferSource();
        src.buffer = buf;
        src.connect(ctx.destination);
        koEngineSource = src;
        src.onended = function () { if (koEngineSource === src) koEngineSource = null; resolve(true); };
        src.start();
      } catch (e) { reject(e); }
    };
    if (ctx.state === 'suspended' && ctx.resume) {
      ctx.resume().then(go).catch(reject);
    } else {
      go();
    }
  });
}
function handleSupertonicMessage(d) {
  if (!d) return;
  if (d.type === 'sherpa-onnx-tts-progress') {
    const p = d.progress;
    if (p && p.count) {
      const part = (p.index + 1) + '/' + p.count;
      setKoVoiceStatus(t('koVoiceLoading') + ' ' + part);
    } else if (d.status) {
      setKoVoiceStatus(String(d.status));
    }
    return;
  }
  if (d.type === 'sherpa-onnx-tts-generation-progress') return;
  if (d.type === 'sherpa-onnx-tts-ready') {
    supertonicReadyFlag = true;
    if (supertonicReady && supertonicReady._resolve) {
      const r = supertonicReady._resolve;
      supertonicReady._resolve = null;
      r(supertonicWorker);
    }
    setKoVoiceStatus('');
    return;
  }
  if (d.type === 'sherpa-onnx-tts-result') {
    if (supertonicGen) {
      const g = supertonicGen;
      supertonicGen = null;
      g.resolve({ samples: d.samples, sampleRate: d.sampleRate });
    }
    return;
  }
  if (d.type === 'error') {
    const err = new Error(d.message || 'supertonic error');
    supertonicReadyFlag = false;
    if (supertonicReady && supertonicReady._resolve) {
      const r = supertonicReady._reject;
      supertonicReady._resolve = null;
      supertonicReady = null;
      if (r) r(err);
    }
    if (supertonicGen) {
      const g = supertonicGen;
      supertonicGen = null;
      g.reject(err);
    }
  }
}
function ensureSupertonic() {
  if (supertonicReady) return supertonicReady;
  toast(t('koVoiceLoading'), 8000);
  setKoVoiceStatus(t('koVoiceLoading'));
  let resolve, reject;
  const p = new Promise(function (res, rej) { resolve = res; reject = rej; });
  p._resolve = resolve;
  p._reject = reject;
  supertonicReady = p;
  try {
    const w = new Worker(siteAsset(KO_VOICE_WORKER_REL));
    supertonicWorker = w;
    w.onmessage = function (ev) { handleSupertonicMessage(ev.data || {}); };
    w.onerror = function (ev) {
      const err = new Error((ev && ev.message) || 'supertonic worker error');
      supertonicReadyFlag = false;
      if (supertonicReady && supertonicReady._reject) {
        const r = supertonicReady._reject;
        supertonicReady._resolve = null;
        supertonicReady = null;
        r(err);
      }
      if (supertonicGen) { const g = supertonicGen; supertonicGen = null; g.reject(err); }
    };
    w.postMessage({ type: 'init' });
    setTimeout(function () {
      if (supertonicReady && supertonicReady._reject) {
        const r = supertonicReady._reject;
        supertonicReady._resolve = null;
        supertonicReady = null;
        supertonicReadyFlag = false;
        r(new Error('supertonic init timeout'));
      }
    }, 180000);
  } catch (e) {
    supertonicReady = null;
    reject(e);
  }
  p.catch(function () {
    try { if (supertonicWorker) supertonicWorker.terminate(); } catch (e) {}
    supertonicWorker = null;
  });
  return p;
}
function generateSupertonic(text, sid) {
  return ensureSupertonic().then(function (w) {
    return new Promise(function (resolve, reject) {
      if (supertonicGen) {
        const old = supertonicGen;
        supertonicGen = null;
        try { old.reject(new Error('cancelled')); } catch (e) {}
      }
      supertonicGen = { resolve: resolve, reject: reject };
      w.postMessage({
        type: 'generateWithConfig',
        text: text,
        sid: sid,
        speed: 1.0,
        genConfig: { sid: sid, speed: 1.0, numSteps: 8, extra: { lang: 'ko' } }
      });
    });
  });
}
function playSupertonicKo(text, sid) {
  if (!supertonicReadyFlag) {
    ensureSupertonic();
    toast(t('koVoiceLoadingFallback'), 6000);
    setKoVoiceStatus(t('koVoiceLoadingFallback'));
    return false;
  }
  return generateSupertonic(text, sid).then(function (audio) {
    if (!audio || !audio.samples || !audio.samples.length) throw new Error('empty audio');
    setKoVoiceStatus('');
    return playPcmSamples(audio.samples, audio.sampleRate);

}
function getKoVoiceChoice() {

function applyKoVoiceEngine() {
  const choice = getKoVoiceChoice();

    KO_VOICE_ENGINE.id = 'supertonic';
    KO_VOICE_ENGINE.sid = choice.sid;
    KO_VOICE_ENGINE.play = function (text) { return playSupertonicKo(text, choice.sid); };

}
function speakKoWithEngineOrDevice(text) {
  try {
    if (KO_VOICE_ENGINE && typeof KO_VOICE_ENGINE.play === 'function') {
      const r = KO_VOICE_ENGINE.play(text);
      if (r && typeof r.then === 'function') {
        r.then(function (ok) {
          if (!ok) speakKoFallback(text);
        }).catch(function (e) {
          if (e && e.message === 'cancelled') return;
          console.warn('KO_VOICE_ENGINE.play failed', e);
          toast(t('koVoiceLoadFail'));
          setKoVoiceStatus(t('koVoiceLoadFail'));
          speakKoFallback(text);
        });
        return true;

      if (r) return true;
    }
  } catch (e) { console.warn('KO_VOICE_ENGINE.play failed', e); }
  return speakKoFallback(text);
}

function zhGlossLineHTML(item) {

function meaningHTML(item, opts) {

 * 한국어기초사전 (text only, CC BY-SA 2.0 KR)
 * Loaded on demand from dict/ next to this page (relative paths).

const KRDICT_PAGE_SIZE = 30;
const KRDICT_CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
const KRDICT_CHO_FILE = { 'ㄱ':'g.json','ㄲ':'gg.json','ㄴ':'n.json','ㄷ':'d.json','ㄸ':'dd.json','ㄹ':'r.json','ㅁ':'m.json','ㅂ':'b.json','ㅃ':'bb.json','ㅅ':'s.json','ㅆ':'ss.json','ㅇ':'ng.json','ㅈ':'j.json','ㅉ':'jj.json','ㅊ':'ch.json','ㅋ':'k.json','ㅌ':'t.json','ㅍ':'p.json','ㅎ':'h.json','etc':'etc.json' };
const KRDICT_POS_OPTIONS = ['명사','동사','형용사','부사','관형사','대명사','감탄사','수사','조사','의존 명사','접사','어미','보조 동사','보조 형용사','품사 없음'];
const KRDICT_LEVEL_OPTIONS = ['초급','중급','고급','없음'];
const KRDICT_UNIT_OPTIONS = ['단어','관용구','구','속담','문법‧표현'];
const KRDICT_POS_TO_CAT = {'명사':'noun','동사':'verb','형용사':'adjective','부사':'adverb','관형사':'determiner','대명사':'pronoun','감탄사':'interjection','수사':'number','조사':'particle','의존 명사':'noun','접사':'job_suffix','어미':'honorific','보조 동사':'verb','보조 형용사':'adjective','품사 없음':'expression'};

let dictMeta = null;
let dictIndex = null; // compact rows [id,ko,zh,hanja,pos,level,unit]
let dictIndexLoading = null;
let dictShardLoading = {};
let dictItemCache = {};
let coreOverridesApplied = false;
let browseDict = { q:'', level:'초급', pos:'all', unit:'단어', page:1, status:'idle', error:'', hits:null };

function dictUrl(rel) { return siteAsset('dict/' + String(rel||'').replace(/^\//, '')); }
function choseongOf(text) {
  const s = String(text||'');
  for (let i=0;i<s.length;i++) {
    const o = s.charCodeAt(i);
    if (o>=0xAC00 && o<=0xD7A3) return KRDICT_CHO[Math.floor((o-0xAC00)/588)] || 'etc';
  }
  return 'etc';
}
function dictLabel(prefix, value) {
  if (!value) return t(prefix+'_none');
  const key = prefix+'_'+value;
  const lab = t(key);
  return lab === key ? value : lab;
}
function normalizeDictItem(raw) {
  const ko = raw.ko || raw[1] || '';
  const pos = raw.pos || raw[4] || '';
  const level = raw.level || raw[5] || '';
  const item = {
    id: raw.id || raw[0],
    oid: raw.oid || '',
    ko: ko,
    zh: raw.zh || raw[2] || '',
    en: raw.en || '',
    hanja: raw.hanja || raw[3] || '',
    pos: pos,
    level: level,
    unit: raw.unit || raw[6] || '',
    glossKo: raw.glossKo || '',
    example: { ko: raw.exampleKo || (raw.example && raw.example.ko) || '', en:'', zh:'' },
    category: KRDICT_POS_TO_CAT[pos] || 'expression',
    register: 'daily',
    topic: 'krdict',
    source: 'krdict',
    difficulty: level==='초급'?1: level==='중급'?2: level==='고급'?3: 0
  };
  if (item.zh === '(无对应词汇)') item.zh = '';
  dictItemCache[item.id] = item;
  return item;
}
function loadDictMeta() {
  if (dictMeta) return Promise.resolve(dictMeta);
  return fetch(dictUrl('meta.json')).then(r => { if (!r.ok) throw new Error('meta '+r.status); return r.json(); }).then(m => { dictMeta = m; return m; });
}
function loadDictIndex() {
  if (dictIndex) return Promise.resolve(dictIndex);
  if (dictIndexLoading) return dictIndexLoading;
  dictIndexLoading = loadDictMeta().then(() => fetch(dictUrl('index.json'))).then(r => {
    if (!r.ok) throw new Error('index '+r.status);
    return r.json();
  }).then(rows => { dictIndex = rows; return rows; }).catch(e => { dictIndexLoading = null; throw e; });
  return dictIndexLoading;
}
function loadDictShard(cho) {
  const file = KRDICT_CHO_FILE[cho] || KRDICT_CHO_FILE.etc;
  if (dictShardLoading[file]) return dictShardLoading[file];
  dictShardLoading[file] = fetch(dictUrl('shards/'+file)).then(r => {
    if (!r.ok) throw new Error('shard '+file+' '+r.status);
    return r.json();
  }).then(arr => { (arr||[]).forEach(normalizeDictItem); return arr; });
  return dictShardLoading[file];
}
function ensureDictItems(rows) {
  const missing = [];
  const chos = {};
  rows.forEach(r => {
    const id = r.id || r[0];
    const ko = (r.ko || r[1] || '');
    const cached = dictItemCache[id];
    if (!cached || !(cached.glossKo || (cached.example && cached.example.ko))) {
      missing.push(id);
      chos[choseongOf(ko)] = true;
    }
  });
  if (!missing.length) return Promise.resolve();
  return Promise.all(Object.keys(chos).map(loadDictShard));
}
async function applyCoreOverrides() {
  if (coreOverridesApplied) return;
  const res = await fetch(dictUrl('core-overrides.json'));
  if (!res.ok) return;
  const ov = await res.json();
  ALL_ITEMS.forEach(it => {
    const o = ov[it.id];
    if (!o) return;
    if (o.zh) it.zh = o.zh;
    if (o.en) it.en = o.en;
    if (o.hanja) it.hanja = o.hanja;
    if (o.glossKo) it.glossKo = o.glossKo;
    if (o.exampleKo) it.example = { ko:o.exampleKo, en:'', zh:'' };
    if (o.pos) it.pos = o.pos;
    if (o.level) it.level = o.level;
    if (o.unit) it.unit = o.unit;
    it.officialId = o.officialId;
  });
  coreOverridesApplied = true;
}
function dictLevelMatch(level, filter) {
  if (!filter || filter==='all') return true;
  if (filter==='없음' || filter==='none') return !level || level==='없음';
  return level===filter;
}
function dictPosMatch(pos, filter) {
  if (!filter || filter==='all') return true;
  if (filter==='품사 없음' || filter==='none') return !pos || pos==='품사 없음';
  return pos===filter;
}
function dictRowMatches(row, q, level, pos, unit) {
  if (!dictLevelMatch(row[5], level)) return false;
  if (!dictPosMatch(row[4], pos)) return false;
  if (unit && unit!=='all' && row[6]!==unit) return false;
  const ko = String(row[1]||'');
  // Bare browse should not open on a wall of -가 / 가- affixes that all romanize as "ga".
  if (!q && pos!=='접사' && (/^-/.test(ko) || /-$/.test(ko))) return false;
  if (!q) return true;
  const blob = ((row[1]||'')+' '+(row[2]||'')+' '+(row[3]||'')+' '+(row[0]||'')).toLowerCase();
  return blob.indexOf(q)!==-1;
}
function searchDictIndex(q, level, pos, unit) {
  const rows = dictIndex || [];
  const nq = String(q||'').trim().toLowerCase();
  const hits = [];
  for (let i=0;i<rows.length;i++) {
    if (dictRowMatches(rows[i], nq, level, pos, unit)) hits.push(rows[i]);
  }
  return hits;
}
function dictCreditHTML() {

function dictSelectOptions(prefix, values, current, allKey) {

function renderDictPager(page, pages) {
  return '<div class="dict-pager">'
    +'<button type="button" class="btn ghost dict-prev"'+(page<=1?' disabled':'')+'>'+esc(t('dictPrev'))+'</button>'
    +'<span class="muted">'+esc(tf('dictPage',{n:String(page), m:String(pages)}))+'</span>'
    +'<button type="button" class="btn ghost dict-next"'+(page>=pages?' disabled':'')+'>'+esc(t('dictNext'))+'</button>'
    +'</div>';
}
function fillDictBrowse() {
  const box = document.getElementById('dict-results');
  if (!box) return;
  const fail = function (e) {
    console.warn(e);
    box.innerHTML = '<p class="muted">'+esc(t('dictLoadError'))+'</p>';
  };
  if (!dictIndex) {
    box.innerHTML = '<p class="muted">'+esc(t('dictLoading'))+'</p>';
    loadDictIndex().then(function () { if (currentPanel==='browse') fillDictBrowse(); }).catch(fail);
    return;
  }
  const hits = searchDictIndex(browseDict.q, browseDict.level, browseDict.pos, browseDict.unit);
  const pages = Math.max(1, Math.ceil(hits.length / KRDICT_PAGE_SIZE));
  if (browseDict.page > pages) browseDict.page = pages;
  if (browseDict.page < 1) browseDict.page = 1;
  const start = (browseDict.page - 1) * KRDICT_PAGE_SIZE;
  const slice = hits.slice(start, start + KRDICT_PAGE_SIZE);
  const pager = hits.length ? renderDictPager(browseDict.page, pages) : '';
  box.innerHTML =
    '<div class="muted">'+esc(tf('dictCount',{n:String(hits.length)}))
    + (hits.length ? '' : ' · '+esc(t('dictNoResult')))
    +'</div>'
    +'<p class="muted">'+esc(t('dictBrowseHint'))+'</p>'
    + pager
    +'<div id="dict-cards"></div>'
    + pager;
  Array.prototype.forEach.call(box.querySelectorAll('.dict-prev'), function (prev) {
    prev.onclick = function () { browseDict.page -= 1; fillDictBrowse(); };
  });
  Array.prototype.forEach.call(box.querySelectorAll('.dict-next'), function (next) {
    next.onclick = function () { browseDict.page += 1; fillDictBrowse(); };
  });
  if (!slice.length) return;
  ensureDictItems(slice).then(function () {
    const cards = document.getElementById('dict-cards');
    if (!cards) return;
    const ready = slice.map(function (r) { return dictItemCache[r[0]] || normalizeDictItem(r); });
    cards.innerHTML = ready.map(function (it) { return cardHTML(it, true); }).join('');
    bindReveal(cards);
    bindGlossSpeak(cards);
  }).catch(fail);
}

let quiz = null; // {queue:[{id, left}], index, correct, total, mode}

function repeatsFor(id) {
  const n = state.itemRepeats[id];
  return (n != null && n > 0) ? n : (state.repeatDefault || 1);
}

function enabledRegisters() {
  const pt = state.practiceTypes || defaultState().practiceTypes;
  return REGISTERS.filter(r => pt[r] !== false);
}
function enabledTopics() {
  const pt = state.practiceTopics || defaultState().practiceTopics;
  return TOPICS.filter(tp => pt[tp] !== false);
}
function filterByPracticeTypes(items) {
  const regs = enabledRegisters();
  const topics = enabledTopics();
  if (!regs.length || !topics.length) return [];
  return items.filter(it => regs.includes(it.register) && topics.includes(itemTopic(it)));
}
function buildQuizQueue(preferMissed) {
  let pool = filterByPracticeTypes(ALL_ITEMS.slice());
  if (preferMissed) {
    pool.sort((a,b) => (state.mistakes[b.id]?.count||0) - (state.mistakes[a.id]?.count||0));
    pool = pool.filter(it => (state.mistakes[it.id]?.count||0) > 0);
    if (!pool.length) pool = filterByPracticeTypes(ALL_ITEMS.slice());
  } else {
    // shuffle
    for (let i=pool.length-1;i>0;i--) {
      const j = Math.floor(Math.random()*(i+1));
      [pool[i],pool[j]] = [pool[j],pool[i]];
    }
  }
  // take up to 12
  pool = pool.slice(0, 12);
  return pool.map(it => ({ id: it.id, left: repeatsFor(it.id) }));
}

    +'<div style="margin-top:10px"><button type="button" class="btn secondary" id="btn-review-due"'+(due.length && !blocked?'':' disabled')+'>'+esc(t('dailyReview'))+'</button></div>'
    +'</div>';

  const topicChips = document.getElementById('topic-chips');
  topicChips.innerHTML = TOPICS.map(tp =>

function startQuiz(preferMissed) {
  if (!enabledTopics().length) { toast(t('noTopicsSelected')); return; }
  if (!enabledRegisters().length) { toast(t('noTypesSelected')); return; }
  const queue = buildQuizQueue(preferMissed);
  if (!queue.length) { toast(t('noTopicsSelected')); return; }
  quiz = { queue, index: 0, correct: 0, total: 0, mode: 'recognition' };
  renderPractice();
}
function startItemQuiz(id, total) {
  const it = getItem(id);
  if (!it) return false;
  quiz = { queue: [{ id: it.id, left: Math.max(1, repeatsFor(it.id) || 2) }], index: 0, correct: 0, total: total || 0, mode: 'recognition' };
  showPanel('practice');
  return true;
}

function currentQuizItem() {
  if (!quiz || !quiz.queue.length) return null;
  // find next with left>0
  for (let i=0;i<quiz.queue.length;i++) {
    const idx = (quiz.index + i) % quiz.queue.length;
    if (quiz.queue[idx].left > 0) return { slot: quiz.queue[idx], idx };
  }
  return null;
}

function renderQuizView(el) {
  const cur = currentQuizItem();
  if (!cur) {
    el.innerHTML = '<div class="card quiz-prompt"><h2>'+esc(t('finished'))+'</h2>'
      +'<p>'+esc(t('score'))+': <strong>'+quiz.correct+' / '+quiz.total+'</strong></p>'
      +'<button type="button" class="btn" id="btn-done">'+esc(t('continue'))+'</button></div>';
    document.getElementById('btn-done').onclick = () => { quiz = null; renderPractice(); };
    return;
  }
  const it = getItem(cur.slot.id);
  // Cycle: recognition → recognition → spelling → usage
  const cycle = quiz.total % 4;
  const useSpelling = cycle === 2;
  const useUsage = cycle === 3;
  quiz._curMode = useUsage ? 'usage' : (useSpelling ? 'spelling' : 'recognition');
  quiz._curIdx = cur.idx;
  quiz._curId = it.id;

  let body = '<div class="card"><div class="row space"><span class="muted">'+(quiz.correct)+'✓ / '+quiz.total
    +' · '+esc(tf('leftCount', {n: cur.slot.left}))+'</span>'
    +'<button type="button" class="btn ghost" id="q-exit">'+esc(t('back'))+'</button></div>';

  if (useUsage) {
    body += '<div class="quiz-prompt"><div class="ko-big">'+esc(it.ko)+'</div>'
      + meaningHTML(it)
      +'<p class="muted">'+esc(t('typeQuestion'))+'</p></div>';
    const regs = REGISTERS.slice();
    for (let i=regs.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [regs[i],regs[j]]=[regs[j],regs[i]]; }
    // ensure correct included
    if (!regs.includes(it.register)) regs[0]=it.register;
    const choices = regs.map(r => ({ id:r, label:t('reg_'+r), correct: r===it.register }));
    body += '<div class="choices" id="q-choices">'
      + choices.map((c,i) => '<button type="button" class="choice" data-i="'+i+'">'+esc(c.label)+'</button>').join('')
      + '</div>';
    quiz._choices = choices;
    quiz._usage = true;
  } else if (!useSpelling) {
    body += '<div class="quiz-prompt"><div class="ko-big">'+esc(it.ko)+'</div>'
      +(it.hanja?'<div class="badge hanja">'+esc(it.hanja)+'</div>':'')
      +'<p class="muted">'+esc(t('chooseMeaning'))+'</p></div>';
    const choices = buildMeaningChoices(it);
    body += '<div class="choices" id="q-choices">'
      + choices.map((c,i) => '<button type="button" class="choice" data-i="'+i+'">'+esc(c.label)+'</button>').join('')
      + '</div>';
    quiz._choices = choices;
    quiz._usage = false;
  } else {
    quiz._usage = false;
    const promptParts = [];
    if (state.uiLang === 'ko') promptParts.push(glossKo(it) || it.en);
    else if (state.uiLang === 'en') promptParts.push(it.en);
    else {
      if (state.showKO) promptParts.push(glossKo(it));
      if (state.showEN || (!state.showEN && !state.showZH && !state.showKO)) promptParts.push(it.en);
      if (state.showZH) promptParts.push(it.zh);
    }
    body += '<div class="quiz-prompt"><p class="muted">'+esc(t('typeKorean'))+'</p>'
      +'<p class="muted">'+esc(t('spellHint'))+'</p>'
      +'<div style="font-size:1.1rem">'+esc(promptParts.join(' · '))+'</div></div>'
      +'<div class="field"><input id="q-input" class="dict-input" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="한국어"></div>'
      +'<div class="row"><button type="button" class="btn" id="q-check">'+esc(t('check'))+'</button>'
      +'<button type="button" class="btn secondary" id="q-skip">'+esc(t('skip'))+'</button></div>'
      +'<div id="q-feedback" style="margin-top:10px"></div>';
  }
  // per-item repeat control
  body += '<div class="field" style="margin-top:14px"><label>'+esc(t('repeatThis'))+'</label>'
    +'<input type="number" id="rep-this" min="1" max="10" value="'+repeatsFor(it.id)+'"></div>';
  body += '</div>';
  el.innerHTML = body;

  document.getElementById('q-exit').onclick = () => { quiz = null; renderPractice(); };
  document.getElementById('rep-this').onchange = e => {
    state.itemRepeats[it.id] = Math.max(1, Math.min(10, parseInt(e.target.value,10)||1));
    cur.slot.left = Math.max(cur.slot.left, state.itemRepeats[it.id]);
    saveState();
  };

  if (!useSpelling || useUsage) {
    el.querySelectorAll('.choice').forEach(btn => {
      btn.onclick = () => onChooseMeaning(parseInt(btn.dataset.i,10), btn);
    });
  } else {
    const input = document.getElementById('q-input');
    input.focus();
    document.getElementById('q-check').onclick = () => onSpellingCheck(input.value);
    document.getElementById('q-skip').onclick = () => advanceQuiz(false);
    input.onkeydown = e => { if (e.key === 'Enter') onSpellingCheck(input.value); };
  }
}

function buildMeaningChoices(it) {
  const others = ALL_ITEMS.filter(x => x.id !== it.id);
  for (let i=others.length-1;i>0;i--) {
    const j = Math.floor(Math.random()*(i+1));
    [others[i],others[j]] = [others[j],others[i]];
  }
  const picks = others.slice(0,3).concat([it]);
  for (let i=picks.length-1;i>0;i--) {
    const j = Math.floor(Math.random()*(i+1));
    [picks[i],picks[j]] = [picks[j],picks[i]];
  }
  return picks.map(p => {
    let label = meaningLabel(p);
    if (!label) label = p.en || p.zh || p.ko || '';
    return { id: p.id, label: label, correct: p.id === it.id };
  });
}

function onChooseMeaning(i, btn) {
  const choices = quiz._choices;
  const chosen = choices[i];
  const it = getItem(quiz._curId);
  quiz.total += 1;
  const buttons = document.querySelectorAll('#q-choices .choice');
  buttons.forEach((b, idx) => {
    b.disabled = true;
    if (choices[idx].correct) b.classList.add('correct');
  });
  if (chosen.correct) {
    btn.classList.add('correct');
    quiz.correct += 1;
    toast(t('correct'));
    advanceQuiz(true, 600);
  } else {
    btn.classList.add('wrong');
    const stage = quiz._usage ? 'usage' : 'recognition';
    const part = recordMistake(it.id, stage, quiz._usage ? 'other' : 'other', chosen.label, it.en);
    toast(t('incorrect') + ' · ' + t('part_'+part));
    // keep left the same (will retry)
    setTimeout(() => { quiz.index = quiz._curIdx; renderQuizView(document.getElementById('panel-practice')); }, 900);
  }
}

function normalizeAnswer(s) {
  return (s||'').trim().replace(/\s+/g,'').normalize('NFC');
}
function onSpellingCheck(val) {
  const it = getItem(quiz._curId);
  quiz.total += 1;
  const ok = normalizeAnswer(val) === normalizeAnswer(it.ko);
  const fb = document.getElementById('q-feedback');
  if (ok) {
    quiz.correct += 1;
    fb.innerHTML = '<span class="result-ok">'+esc(t('correct'))+'</span>';
    advanceQuiz(true, 500);
  } else {
    const part = recordMistake(it.id, 'spelling', null, val, it.ko);
    fb.innerHTML = '<span class="result-bad">'+esc(t('incorrect'))+'</span> → <strong>'+esc(it.ko)+'</strong>'
      +'<div class="muted">'+esc(t('autoDetected'))+': '+esc(t('part_'+part))+'</div>'
      +'<div class="row" style="margin-top:8px" id="fix-part">'
      + PARTS.map(p => '<button type="button" class="chip" data-p="'+p+'">'+esc(t('part_'+p))+'</button>').join('')
      +'</div>';
    document.querySelectorAll('#fix-part .chip').forEach(c => {
      c.onclick = () => { setMistakePart(it.id, c.dataset.p); toast(t('saved')); };
    });
    setTimeout(() => { quiz.index = quiz._curIdx; renderQuizView(document.getElementById('panel-practice')); }, 1400);
  }
}

function advanceQuiz(wasCorrect, delay) {
  const idx = quiz._curIdx;
  if (wasCorrect) {
    quiz.queue[idx].left = Math.max(0, quiz.queue[idx].left - 1);
    if (quiz.queue[idx].left === 0) {
      enqueueReview(quiz.queue[idx].id, 1);
      if (quiz.fromDue) {
        state.reviewQueue = state.reviewQueue.filter(x => x.id !== quiz.queue[idx].id);
        saveState();
      }
    }
  }
  quiz.index = (idx + 1) % quiz.queue.length;
  setTimeout(() => renderQuizView(document.getElementById('panel-practice')), delay || 400);
}

/********************
 * Compose sentences (pick words, write a sentence, save locally)
 ********************/
let composeSelected = {};
let composeQuery = '';
let composeDraft = '';

function composeUid() {
  return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}
function koStems(ko) {
  return String(ko || '')
    .split(/[\/,，、]/)
    .map(function (s) {
      return s.replace(/[-~～()\[\]（）\s]/g, '').replace(/[A-Za-z0-9']/g, '').replace(/[^\uac00-\ud7a3]/g, '');
    })
    .filter(function (s) { return s.length; });
}
function composeMissingItems(sentence, items) {
  return items.filter(function (it) {
    const stems = koStems(it.ko);
    if (!stems.length) return false;
    return !stems.some(function (st) { return sentence.indexOf(st) !== -1; });
  });
}
function composeItemLabelHTML(it) {
  const zh = zhGlossLineHTML(it);
  let extra = '';
  if (state.uiLang === 'en' && it.en) extra = '<div class="en muted">'+esc(it.en)+'</div>';
  else if (state.uiLang === 'ko' && glossKo(it)) extra = '<div class="muted">'+esc(glossKo(it))+'</div>';
  return '<span class="ko-form">'+esc(it.ko)+'</span>'
    + (zh ? '<span class="zh">'+zh+'</span>' : '')
    + extra;
}
function composeSelectedItems() {
  return Object.keys(composeSelected).map(function (id) { return getItem(id); }).filter(Boolean);
}
function composeKoOfId(id) {
  const it = getItem(id);
  if (it) return it.ko;
  if (dictIndex) {
    for (let i=0;i<dictIndex.length;i++) {
      if (dictIndex[i][0]===id) return dictIndex[i][1];
    }
  }
  return id;
}
function renderCompose() {
  const el = document.getElementById('panel-compose');
  const q = (composeQuery || '').trim().toLowerCase();
  const builtIn = ALL_ITEMS.filter(function (it) {
    if (!q) return true;
    const blob = [it.ko, it.zh, it.en, it.hanja, glossKo(it), it.id].join(' ').toLowerCase();
    return blob.indexOf(q) !== -1;
  });
  const selectedItems = composeSelectedItems();
  const saved = (state.composedSentences || []).slice().reverse();

  function paintWordList(dictRows) {
    const seen = {};
    const items = [];
    function add(it) {
      if (!it || seen[it.id]) return;
      seen[it.id] = true;
      items.push(it);
    }
    selectedItems.forEach(add);
    builtIn.forEach(add);
    (dictRows || []).forEach(function (row) { add(dictItemCache[row[0]] || normalizeDictItem(row)); });
    const list = document.getElementById('compose-word-list');
    if (!list) return;
    if (!items.length) {
      list.innerHTML = '<p class="muted">'+esc(q ? t('dictNoResult') : t('composeSearchHint'))+'</p>';
      return;
    }
    list.innerHTML = items.map(function (it) {
      const on = !!composeSelected[it.id];
      return '<label class="compose-word'+(on?' selected':'')+'">'
        +'<input type="checkbox" data-id="'+esc(it.id)+'"'+(on?' checked':'')+'>'
        +'<span>'+composeItemLabelHTML(it)+'</span></label>';
    }).join('');
    list.querySelectorAll('input').forEach(function (box) {
      box.onchange = function () {
        const ta = document.getElementById('compose-text');
        if (ta) composeDraft = ta.value;
        if (box.checked) composeSelected[box.dataset.id] = true;
        else delete composeSelected[box.dataset.id];
        renderCompose();
      };
    });
  }

  el.innerHTML =
    '<div class="card"><h2>'+esc(t('composeTitle'))+'</h2>'
    +'<p class="muted">'+esc(t('composeHint'))+'</p>'
    +'<p class="muted">'+esc(t('composeSearchHint'))+'</p></div>'
    +'<div class="card"><h3>'+esc(t('composePick'))+'</h3>'
    +'<div class="field"><label for="compose-search">'+esc(t('composeSearch'))+'</label>'
    +'<input id="compose-search" type="search" value="'+esc(composeQuery)+'" placeholder="'+esc(t('dictSearchPh'))+'" autocomplete="off"></div>'
    + (selectedItems.length ? '<p class="muted">'+esc(t('composeWordsLabel'))+': '+esc(selectedItems.map(function(it){return it.ko;}).join(' · '))+'</p>' : '')
    +'<div class="compose-word-list" id="compose-word-list"></div></div>'
    +'<div class="card"><h3>'+esc(t('composeWrite'))+'</h3>'
    +'<div class="field"><textarea id="compose-text" placeholder="'+esc(t('composePlaceholder'))+'">'+esc(composeDraft)+'</textarea></div>'
    +'<div id="compose-soft-hint"></div>'
    +'<button type="button" class="btn secondary" id="compose-save">'+esc(t('composeSave'))+'</button>'
    +'</div>'
    +'<div class="card"><h3>'+esc(t('composeSavedList'))+'</h3>'
    + (saved.length
        ? saved.map(function (m, idx) {
            const words = (m.wordIds || []).map(composeKoOfId).filter(Boolean);
            const realIdx = (state.composedSentences || []).length - 1 - idx;
            return '<div class="row space" style="padding:8px 0;border-bottom:1px solid var(--border);align-items:flex-start">'
              +'<div><div>'+esc(m.text)+glossSpeakBtnHTML(m.text)+'</div>'
              + (words.length ? '<div class="compose-meta">'+esc(t('composeWordsLabel'))+': '+esc(words.join(' · '))+'</div>' : '')
              +'<div class="muted">'+(m.at||'')+'</div></div>'
              +'<button type="button" class="btn ghost compose-del" data-i="'+realIdx+'">'+esc(t('delete'))+'</button></div>';
          }).join('')
        : '<p class="muted">'+esc(t('composeEmpty'))+'</p>')
    +'</div>';

  const search = document.getElementById('compose-search');
  const ta = document.getElementById('compose-text');
  search.oninput = function () { composeQuery = search.value; composeDraft = ta.value; renderCompose(); };
  ta.oninput = function () { composeDraft = ta.value; };
  document.getElementById('compose-save').onclick = function () {
    composeDraft = (ta.value || '').trim();
    ta.value = composeDraft;
    const picked = composeSelectedItems();
    if (!picked.length) { toast(t('composeNeedWords')); return; }
    if (!composeDraft) { toast(t('composeNeedText')); return; }
    const missing = composeMissingItems(composeDraft, picked);
    const hint = document.getElementById('compose-soft-hint');
    if (missing.length) {
      hint.innerHTML = '<p class="compose-hint-soft">'+esc(t('composeMissing'))+'</p>';
    } else {
      hint.innerHTML = '';
    }
    if (!state.composedSentences) state.composedSentences = [];
    state.composedSentences.push({
      id: composeUid(),
      wordIds: picked.map(function (it) { return it.id; }),
      text: composeDraft,
      at: new Date().toISOString()
    });
    saveState();
    composeDraft = '';
    toast(missing.length ? t('composeMissing') : t('saved'));
    renderCompose();
  };
  el.querySelectorAll('.compose-del').forEach(function (btn) {
    btn.onclick = function () {
      const i = parseInt(btn.dataset.i, 10);
      (state.composedSentences || []).splice(i, 1);
      saveState();
      renderCompose();
    };
  });
  bindGlossSpeak(el);

  const COMPOSE_DICT_LIMIT = 40;
  if (q) {
    if (!dictIndex) {
      paintWordList([]);
      const list = document.getElementById('compose-word-list');
      if (list && !list.innerHTML) list.innerHTML = '<p class="muted">'+esc(t('dictLoading'))+'</p>';
      else if (list) list.insertAdjacentHTML('afterbegin', '<p class="muted">'+esc(t('dictLoading'))+'</p>');
      loadDictIndex().then(function () { if (currentPanel==='compose') renderCompose(); }).catch(function (e) {
        console.warn(e);
        const box = document.getElementById('compose-word-list');
        if (box) box.insertAdjacentHTML('beforeend', '<p class="muted">'+esc(t('dictLoadError'))+'</p>');
      });
    } else {
      const hits = searchDictIndex(q, 'all', 'all', 'all').slice(0, COMPOSE_DICT_LIMIT);
      ensureDictItems(hits).then(function () { paintWordList(hits); }).catch(function () { paintWordList(hits); });
    }
  } else {
    paintWordList([]);
  }
}

/********************
 * Mistakes
 ********************/
let mistakeFilter = { stage:'all', part:'all', sort:'count' };

function renderMistakes() {
  const el = document.getElementById('panel-mistakes');
  let entries = Object.keys(state.mistakes).map(id => ({ id, ...state.mistakes[id] }));
  entries = entries.filter(e => {
    if (mistakeFilter.stage !== 'all' && !(e.stages && e.stages[mistakeFilter.stage])) return false;
    if (mistakeFilter.part !== 'all' && !(e.parts && e.parts[mistakeFilter.part])) return false;
    return true;
  });
  entries.sort((a,b) => {
    const ia = getItem(a.id), ib = getItem(b.id);
    if (mistakeFilter.sort === 'topik') {
      return (Number(ia&&ia.difficulty)||0) - (Number(ib&&ib.difficulty)||0) || (b.count||0)-(a.count||0);
    }
    if (mistakeFilter.sort === 'type') {
      const ra = (ia&&ia.register)||'', rb = (ib&&ib.register)||'';
      return ra.localeCompare(rb) || (b.count||0)-(a.count||0);
    }
    return (b.count||0) - (a.count||0);
  });

  el.innerHTML =
    '<div class="card"><h2>'+esc(t('mistakesTitle'))+'</h2>'
    +'<p class="muted">'+esc(t('mistakesHint'))+'</p>'
    +'<div class="filters">'
    +'<select id="m-stage"><option value="all">'+esc(t('all'))+' · '+esc(t('filterStage'))+'</option>'
    +STAGES.map(s=>'<option value="'+s+'"'+(mistakeFilter.stage===s?' selected':'')+'>'+esc(stageLabel(s))+'</option>').join('')
    +'</select>'
    +'<select id="m-part"><option value="all">'+esc(t('all'))+' · '+esc(t('filterPart'))+'</option>'
    +PARTS.map(p=>'<option value="'+p+'"'+(mistakeFilter.part===p?' selected':'')+'>'+esc(t('part_'+p))+'</option>').join('')
    +'</select>'
    +'<select id="m-sort" aria-label="'+esc(t('sortBy'))+'">'
    +'<option value="count"'+(mistakeFilter.sort==='count'?' selected':'')+'>'+esc(t('sortBy'))+': '+esc(t('sortCount'))+'</option>'
    +'<option value="type"'+(mistakeFilter.sort==='type'?' selected':'')+'>'+esc(t('sortBy'))+': '+esc(t('sortType'))+'</option>'
    +'<option value="topik"'+(mistakeFilter.sort==='topik'?' selected':'')+'>'+esc(t('sortBy'))+': '+esc(t('sortTopik'))+'</option>'
    +'</select>'
    +'</div>'
    +'<div class="row">'
    +'<button type="button" class="btn" id="m-review"'+(entries.length?'':' disabled')+'>'+esc(t('reviewMissed'))+'</button>'
    +'<button type="button" class="btn secondary danger" id="m-clear">'+esc(t('clearMistakes'))+'</button>'
    +'</div></div>'
    + (entries.length ? entries.map(e => {
        const it = getItem(e.id);
        if (!it) return '';
        const stageBits = STAGES.filter(s => e.stages && e.stages[s]).map(s => stageLabel(s)+'×'+e.stages[s]).join(', ');
        const partBits = PARTS.filter(p => e.parts && e.parts[p]).map(p => t('part_'+p)+'×'+e.parts[p]).join(', ');
        return '<div class="card mistake-item">'
          +'<div class="row space"><div class="ko-big" style="font-size:1.3rem">'+esc(it.ko)+'</div>'
          +'<span class="badge">'+esc(t('count'))+': '+e.count+'</span></div>'
          + meaningHTML(it)
          +'<div style="margin-top:6px">'+badgesHTML(it)+'</div>'
          +'<div class="muted" style="margin-top:6px">'+esc(stageBits||t('none'))+'</div>'
          +'<div class="muted">'+esc(partBits||t('none'))+'</div>'
          +(e.lastAt ? '<div class="muted">'+esc(t('lastAt'))+': '+esc(e.lastAt)+'</div>' : '')
          +'<div class="muted">'+esc(t('pickWrongPart'))+'</div>'
          +'<div class="row" style="margin-top:6px">'
          + PARTS.map(p => '<button type="button" class="chip fix-part '+(e.lastPart===p?'active':'')+'" data-id="'+esc(e.id)+'" data-p="'+p+'">'+esc(t('part_'+p))+'</button>').join('')
          +'</div></div>';
      }).join('')
      : '<div class="card empty">'+esc(t('emptyMistakes'))+'</div>');

  document.getElementById('m-stage').onchange = e => { mistakeFilter.stage = e.target.value; renderMistakes(); };
  document.getElementById('m-part').onchange = e => { mistakeFilter.part = e.target.value; renderMistakes(); };
  document.getElementById('m-sort').onchange = e => { mistakeFilter.sort = e.target.value; renderMistakes(); };
  document.getElementById('m-review').onclick = () => { showPanel('practice'); startQuiz(true); };
  document.getElementById('m-clear').onclick = () => {
    if (confirm(t('confirmClear'))) { state.mistakes = {}; saveState(); renderMistakes(); }
  };
  el.querySelectorAll('.fix-part').forEach(b => {
    b.onclick = () => { setMistakePart(b.dataset.id, b.dataset.p); renderMistakes(); toast(t('saved')); };
  });
}

function importProgressFile(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      const incoming = data.state || data;
      if (!incoming || typeof incoming !== 'object') throw new Error('bad');
      const keepAuth = (state && state.auth && state.auth.signedIn) ? state.auth : null;
      state = Object.assign(defaultState(), incoming, {
        revealFields: Object.assign(defaultState().revealFields, incoming.revealFields||{}),
        practiceTypes: Object.assign(defaultState().practiceTypes, incoming.practiceTypes||{}),
        practice: Object.assign(defaultState().practice, incoming.practice||{}),
        translateSetup: Object.assign(defaultState().translateSetup, incoming.translateSetup||{}),
        translateSides: Object.assign(defaultState().translateSides, incoming.translateSides||{}, {
          a: Object.assign(defaultState().translateSides.a, ((incoming.translateSides||{}).a||{})),
          b: Object.assign(defaultState().translateSides.b, ((incoming.translateSides||{}).b||{})),
        }),
        translateFavorites: Array.isArray(incoming.translateFavorites) ? incoming.translateFavorites : [],
        aiFavorites: Array.isArray(incoming.aiFavorites) ? incoming.aiFavorites : [],
        practiceTopics: Object.assign(defaultState().practiceTopics, incoming.practiceTopics||{}),
        aiChat: Object.assign(defaultState().aiChat, (incoming.aiChat||{}), {
          filters: Object.assign(defaultState().aiChat.filters, ((incoming.aiChat||{}).filters||{})),
          messages: Array.isArray((incoming.aiChat||{}).messages) ? incoming.aiChat.messages : [],
        }),
        auth: Object.assign(defaultState().auth, incoming.auth||{}),
        koVoiceChoice: sanitizeKoVoiceChoice(incoming.koVoiceChoice),
      });
      if (keepAuth && !(state.auth && state.auth.signedIn)) state.auth = keepAuth;
      applyKoVoiceEngine();
      saveState();
      toast(t('importOk'));
      renderAll();
    } catch (err) {
      console.warn(err);
      toast(t('importFail'));
    }
    e.target.value = '';
  };
  reader.readAsText(file);
}


/********************
 * Hangul → Revised Romanization (basic + liaison)
 ********************/
const RR_CHO = ['g','kk','n','d','tt','r','m','b','pp','s','ss','','j','jj','ch','k','t','p','h'];
const RR_JUNG = ['a','ae','ya','yae','eo','e','yeo','ye','o','wa','wae','oe','yo','u','wo','we','wi','yu','eu','ui','i'];
// jong index 0 = none
const RR_JONG = ['','k','k','k','n','n','n','t','l','k','m','l','l','l','l','l','m','p','p','t','t','ng','t','t','k','t','p','t'];
// when jong moves before a vowel (liaison), use onset forms for double/cluster where needed
const RR_JONG_ONSET = ['','g','kk','ks','n','nj','nh','d','r','lg','lm','lb','ls','lt','lp','lh','m','b','bs','s','ss','ng','j','ch','k','t','p','h'];

function decomposeHangul(ch) {
  const code = ch.charCodeAt(0);
  if (code < 0xAC00 || code > 0xD7A3) return null;
  const S = code - 0xAC00;
  return { cho: Math.floor(S / 588), jung: Math.floor((S % 588) / 28), jong: S % 28 };
}

function romanizeHangul(text) {
  const chars = Array.from(String(text || ''));
  const syl = chars.map(c => {
    const d = decomposeHangul(c);
    return d ? { type:'h', ch:c, ...d } : { type:'o', ch:c };
  });
  // liaison: move jong to next cho when next cho is silent ㅇ (11)
  for (let i = 0; i < syl.length - 1; i++) {
    const a = syl[i], b = syl[i+1];
    if (a.type === 'h' && b.type === 'h' && a.jong > 0 && b.cho === 11) {
      b._onsetFromJong = a.jong;
      a.jong = 0;
    }
  }
  let out = '';
  for (const s of syl) {
    if (s.type !== 'h') { out += s.ch; continue; }
    let onset = '';
    if (s._onsetFromJong != null) onset = RR_JONG_ONSET[s._onsetFromJong] || '';
    else onset = RR_CHO[s.cho] || '';
    const vowel = RR_JUNG[s.jung] || '';
    const coda = RR_JONG[s.jong] || '';
    out += onset + vowel + coda;
  }
  return out;
}

/********************
 * Translation stub (NO fabricated translations; server later)
 ********************/
/**
 * @param {string} text
 * @param {string} from  'ko'|'zh'|'en'
 * @param {string} to    'ko'|'zh'|'en'
 * @param {boolean} honorific
 * @returns {Promise<{text:string, pending:boolean, honorific:boolean}>}
 */
async function translate(text, from, to, honorific) {
  // No API keys or prompts in the client. Do not invent translations.
  if (!AI_ENDPOINT) {
    return {
      text: t('trTransPending'),
      pending: true,
      honorific: !!honorific,
    };
  }
  try {
    const res = await fetch(AI_ENDPOINT.replace(/\/+$/, '') + '/translate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        text, from, to, honorific: !!honorific,
        profile: state.translateSetup || null,
      }),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    return {
      text: (data && (data.text || data.translation)) || t('trTransPending'),
      pending: !(data && (data.text || data.translation)),
      honorific: !!honorific,
      roma: data && data.roma ? data.roma : undefined,
    };
  } catch (e) {
    console.warn('translate failed', e);
    return {
      text: t('trTransPending'),
      pending: true,
      honorific: !!honorific,
    };
  }
}

/********************
 * Translate / Conversation panel
 ********************/
let trShowFavorites = false;
let trActiveMic = null; // { side, recog }

function trUid() {
  return 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function speakText(text, lang) {
  if (!(state.translateSetup && state.translateSetup.voiceOn)) {
    toast(t('trVoiceOff'));
    return;
  }
  if (lang === 'ko') { speakKo(text); return; }
  if (!window.speechSynthesis) {
    toast(t('noKoVoice'));
    return;
  }
  const map = { ko:'ko-KR', zh:'zh-CN', en:'en-US' };
  stopKoAudio();
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(String(text || ''));
  u.lang = map[lang] || 'ko-KR';
  u.rate = 0.85;
  u.pitch = 1;
  const voices = speechSynthesis.getVoices() || [];
  const pref = voices.find(v => (v.lang || '').toLowerCase().startsWith((map[lang]||'').toLowerCase().slice(0,2)));
  if (pref) u.voice = pref;
  speechSynthesis.speak(u);
}

function getSpeechRecognition() {
  return window.SpeechRecognition || window.webkitSpeechRecognition || null;
}

function stopTrMic() {
  if (trActiveMic && trActiveMic.recog) {
    try { trActiveMic.recog.stop(); } catch (e) {}
  }
  trActiveMic = null;
}

function startTrMic(sideKey) {
  const SR = getSpeechRecognition();
  if (!SR) { toast(t('trMicUnsupported')); return; }
  if (!(state.translateSetup && state.translateSetup.voiceOn)) { toast(t('trVoiceOff')); return; }
  stopTrMic();
  const side = state.translateSides[sideKey];
  const recog = new SR();
  const langMap = { ko:'ko-KR', zh:'zh-CN', en:'en-US' };
  recog.lang = langMap[side.lang] || 'ko-KR';
  recog.interimResults = false;
  recog.maxAlternatives = 1;
  trActiveMic = { side: sideKey, recog };
  toast(t('trListening'));
  const btn = document.getElementById('tr-mic-'+sideKey);
  if (btn) btn.classList.add('recording');
  recog.onresult = (ev) => {
    const said = (ev.results && ev.results[0] && ev.results[0][0] && ev.results[0][0].transcript) || '';
    const ta = document.getElementById('tr-input-'+sideKey);
    if (ta && said) {
      ta.value = (ta.value ? ta.value + ' ' : '') + said.trim();
    }
  };
  recog.onerror = () => {
    toast(t('trMicOff'));
    stopTrMic();
    if (btn) btn.classList.remove('recording');
  };
  recog.onend = () => {
    if (btn) btn.classList.remove('recording');
    trActiveMic = null;
  };
  try { recog.start(); } catch (e) { toast(t('trMicOff')); stopTrMic(); }
}

async function addUtterance(sideKey, text) {
  text = String(text || '').trim();
  if (!text) return;
  const side = state.translateSides[sideKey];
  const honorific = true;
  const from = side.lang;
  const to = side.other;
  const result = await translate(text, from, to, honorific);
  const card = {
    id: trUid(),
    original: text, // NEVER cleared
    translation: result.text,
    pending: !!result.pending,
    from, to,
    honorific,
    roma: (from === 'ko' || /[\uAC00-\uD7A3]/.test(text)) ? romanizeHangul(text) : '',
    at: new Date().toISOString(),
  };
  side.utterances.push(card);
  saveState();
  renderTranslate();
}

function toggleHonorific(sideKey, uid) {
  const side = state.translateSides[sideKey];
  const u = (side.utterances || []).find(x => x.id === uid);
  if (!u) return;
  u.honorific = !u.honorific;
  // Re-call stub so future server can retranslate; keep original forever
  translate(u.original, u.from, u.to, u.honorific).then(r => {
    u.translation = r.text;
    u.pending = !!r.pending;
    saveState();
    renderTranslate();
  });
}

function copyText(text) {
  const s = String(text || '');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(s).then(() => toast(t('trCopied'))).catch(() => fallbackCopy(s));
  } else fallbackCopy(s);
}
function fallbackCopy(s) {
  const ta = document.createElement('textarea');
  ta.value = s; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast(t('trCopied')); } catch (e) {}
  document.body.removeChild(ta);
}

function isFav(uid) {
  return (state.translateFavorites || []).some(f => f.id === uid || f.sourceId === uid);
}

function toggleFavorite(sideKey, uid) {
  const side = state.translateSides[sideKey];
  const u = (side.utterances || []).find(x => x.id === uid);
  if (!u) return;
  const idx = (state.translateFavorites || []).findIndex(f => f.sourceId === uid || f.id === uid);
  if (idx >= 0) {
    state.translateFavorites.splice(idx, 1);
  } else {
    state.translateFavorites.push({
      id: trUid(),
      sourceId: u.id,
      original: u.original,
      translation: u.translation,
      roma: u.roma,
      from: u.from,
      to: u.to,
      honorific: u.honorific,
      at: new Date().toISOString(),
    });
    toast(t('trFavSaved'));
  }
  saveState();
  renderTranslate();
}

function removeFavorite(fid) {
  state.translateFavorites = (state.translateFavorites || []).filter(f => f.id !== fid);
  saveState();
  if (currentPanel === 'favorites') renderFavorites();
  else renderTranslate();
}

function aiUid() {
  return 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function getAiModels() {
