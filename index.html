function shuffleCopy(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
function cleanHangul(s) {
  return String(s || '').replace(/[^\uac00-\ud7a3]/g, '');
}
function bestEntriesForToken(tok) {
  const clean = cleanHangul(tok);
  if (!clean) return [];
  let bestLen = 0;
  let best = [];
  ALL_ITEMS.forEach(function (it) {
    koStems(it.ko).forEach(function (st) {
      if (!st) return;
      if (clean === st || clean.indexOf(st) === 0) {
        if (st.length > bestLen) { bestLen = st.length; best = [it]; }
        else if (st.length === bestLen && !best.some(function (x) { return x.id === it.id; })) best.push(it);
      }
    });
  });
  return best;
}

    const items = bestEntriesForToken(tok);
    if (items.length) return items.map(function (it) { return { tok: tok, item: it, kr: null }; });
    return [{ tok: tok, item: null, kr: null }];
  }).reduce(function (acc, row) { return acc.concat(row); }, []);
}

function listenDistractorIds(item) {
  const pool = vocabForGrade(item.grade);
  const used = new Set([item.glossZh]);
  const candidates = [];
  shuffleCopy(pool).forEach(function (row) {
    if (!row || row.id === item.id || used.has(row.glossZh)) return;
    used.add(row.glossZh);
    candidates.push(row);
  });
  function sharesTag(row) {
    const tags = row.semanticTags || [];
    return (item.semanticTags || []).some(function (tag) { return tags.indexOf(tag) >= 0; });
  }
  const same = shuffleCopy(candidates.filter(sharesTag));
  const other = shuffleCopy(candidates.filter(function (row) { return !sharesTag(row); }));
  return same.concat(other).slice(0, 3).map(function (row) { return row.id; });
}

  (matchRound.links || []).forEach(function (pair) {
    const a = board.querySelector('[data-side="l"][data-id="'+pair.l+'"]');
    const b = board.querySelector('[data-side="r"][data-id="'+pair.r+'"]');
    if (!a || !b) return;
    const p = center(a); const q = center(b);
    lines += '<line x1="'+p.x+'" y1="'+p.y+'" x2="'+q.x+'" y2="'+q.y+'" stroke="currentColor" stroke-width="3" />';
  });
  svg.innerHTML = lines;
}

function ensureGex() {
  if (session && session.mode === 'grammar' && session.phase === 'question') {
    if (gex && gex.sessionIndex === session.index) return;
    gex = { ids: session.order.slice(), index: session.index, sessionIndex: session.index, checked: false, choice: null, pending: null, ok: false, explainOpen: false };
    return;
  }
  if (gex) return;
  const ids = shuffleCopy(GRAMMAR.map(function (g) { return g.id; }));
  let index = 0;
  if (gexPrefer) {
    const g = GRAMMAR[gexPrefer];
    if (g) index = Math.max(0, ids.indexOf(g.id));
    gexPrefer = 0;
  }
  gex = { ids: ids, index: index, checked: false, choice: null, ok: false, explainOpen: false };
}
function renderGrammarExercise() {
  ensureGex();
  const body = document.getElementById('practice-body');
  if (!body) return;
  const gid = gex.ids[gex.index];
  const g = GRAMMAR.find(function (x) { return x.id === gid; }) || GRAMMAR[0];
  if (!gex.layout || gex.layoutFor !== g.id) {
    const others = gex.ids.filter(function (id) { return id !== g.id; }).slice(0, 3);
    gex.layout = shuffleCopy([g.id].concat(others));
    gex.layoutFor = g.id;
  }
  const choices = gex.layout;
  const prompt = state.uiLang === 'en' ? g.en : (g.zh || g.en);
  body.innerHTML = '<div class="card"><h3>'+esc(t('nav_grammar'))+'</h3>'
    + '<p class="muted">'+esc(t('grammarExHint'))+'</p>'
    + '<p><strong>'+esc(prompt || '')+'</strong></p>'
    + '<div class="choices" id="gex-choices">'
    + choices.map(function (id) {
        const item = GRAMMAR.find(function (x) { return x.id === id; });
        const on = (gex.pending === id || gex.choice === id);
        return '<button type="button" class="choice'+(on ? ' selected' : '')+'" data-gid="'+esc(id)+'">'+esc(item ? item.pattern : id)+'</button>';
      }).join('')
    + '</div>'
    + '<div class="row" style="margin-top:8px">'
    + '<button type="button" class="btn" id="gex-check"'+((gex.pending || gex.checked) && !gex.checked ? '' : ' disabled')+'>'+esc(t('check'))+'</button>'
    + (gex.checked ? '<button type="button" class="btn" id="gex-next">'+esc(t('tileNext'))+'</button>' : '')
    + '</div><div id="gex-result"></div>'
    + '</div>';
  if (!gex.checked) {
    body.querySelectorAll('.choice').forEach(function (btn) {
      btn.onclick = function () {
        gex.pending = btn.getAttribute('data-gid');
        renderPractice();
      };
    });
    document.getElementById('gex-check').onclick = function () {
      if (gex.checked || !gex.pending) return;
      gex.choice = gex.pending;
      gex.checked = true;
      gex.ok = gex.choice === g.id;
      gex.explainOpen = false;
      const firstRecord = sessionRecord();
      if (!gex.ok && firstRecord) recordMistake(grammarMistakeId(g), 'usage', 'other', gex.choice, g.id);
      renderPractice();
    };
  } else {
    body.querySelectorAll('.choice').forEach(function (btn) { btn.disabled = true; });
    const box = document.getElementById('gex-result');
    box.innerHTML = resultBarHTML(gex.ok, 'gex-explain');
    bindExplainRoot(box, function () {
      const hits = hitsForText(g.example && g.example.ko);
      let leadId = null;
      if (!gex.ok) {
        const chosen = GRAMMAR.find(function (x) { return x.id === gex.choice; });
        const wrongIds = {};
        hitsForText(chosen && chosen.example && chosen.example.ko).forEach(function (h) { if (h.item) wrongIds[h.item.id] = true; });
        const diff = hits.find(function (h) { return h.item && !wrongIds[h.item.id]; });
        if (diff && diff.item) leadId = diff.item.id;
      }
      let html = '<div class="explain-item"><div class="muted">'+esc(t('grammarPatternLabel'))+'</div>'
        + '<button type="button" class="btn secondary" data-grammar-jump="'+esc(g.id)+'">'+esc(g.pattern)+'</button>'
        + (g.zh ? '<div>'+esc(g.zh)+'</div>' : '')
        + (g.en ? '<div class="en">'+esc(g.en)+'</div>' : '')
        + (g.example && g.example.ko ? '<p>'+esc(g.example.ko)+'</p>' : fieldOrMissing(t('example'), '', ''))
        + '</div>';
      html += explainListHTML(hits, leadId, null, null);
      return html;
    });
    if (gex.explainOpen) {
      const b = box.querySelector('.explain-toggle');
      if (b) b.click();
    }
  }
  const gnext = document.getElementById('gex-next');
  if (gnext) gnext.onclick = function () {
    if (session && session.mode === 'grammar') { sessionNext(); return; }
    gex.index = (gex.index + 1) % gex.ids.length;
    gex.checked = false;
    gex.choice = null;
    gex.pending = null;
    gex.ok = false;
    gex.explainOpen = false;
    gex.sessionIndex = null;
    renderPractice();
  };
}

function dictExplainHTML(it, attempt) {
  const hits = [{ tok: it.ko, item: it, kr: null }];
  let html = explainListHTML(hits, attempt && !attempt.ok ? it.id : null, null, null);
  if (attempt && !attempt.ok) {
    html += '<div class="muted">'+esc(t('pickWrongPart'))+'</div><div class="row" id="d-fix">'
      + PARTS.map(function (p) { return '<button type="button" class="chip" data-p="'+p+'">'+esc(t('part_'+p))+'</button>'; }).join('')
      + '</div>';
  }
  return html;
}
function restoreDictAttempt() {
  if (!dictAttempt) return;
  const idx = state.dictationIndex || 0;
  const it = PERSON_ITEMS[idx];
  if (!it || dictAttempt.id !== it.id) return;
  const fb = document.getElementById('d-feedback');
  if (!fb) return;
  fb.innerHTML = resultBarHTML(!!dictAttempt.ok, 'dict-explain');
  bindExplainRoot(fb, function () { return dictExplainHTML(it, dictAttempt); });
  const box = document.getElementById('dict-explain');
  if (box) {
    box.addEventListener('click', function (ev) {
      const chip = ev.target && ev.target.closest ? ev.target.closest('#d-fix .chip') : null;
      if (!chip) return;
      setMistakePart(it.id, chip.getAttribute('data-p'));
      toast(t('saved'));
    });
  }
  if (dictAttempt.explainOpen) {
    const b = fb.querySelector('.explain-toggle');
    if (b) b.click();
  }
}
