}

function filteredAiModels() {
  ensureAiChat();
  const f = state.aiChat.filters || {};
  return getAiModels().filter(m => {
    if (f.vendor && m.vendor !== f.vendor) return false;
    if (f.group && m.group !== f.group) return false;
    if (f.billing && m.billing !== f.billing) return false;
    if (f.tag && !(m.tags || []).includes(f.tag)) return false;
    if (f.endpoint && m.endpoint !== f.endpoint) return false;
    return true;
  });
}

function getSelectedAiModel() {
  ensureAiChat();
  const list = getAiModels();
  return list.find(m => m.id === state.aiChat.selectedModelId) || list[0] || null;
}

/**
 * Single network entry for AI chat.
 * POSTs to AI_ENDPOINT. No keys / system prompts in the client.
 * @param {Array<{role:string,content:string}>} messages
 * @param {string} model
 * @returns {Promise<{ok:boolean, content?:string, error?:string, notConnected?:boolean}>}
 */
async function callAI(messages, model) {
  if (!AI_ENDPOINT) {
    return { ok: false, notConnected: true, error: t('aiNotConnected') };
  }
  try {
    const res = await fetch(AI_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages, model }),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const content = (data && (data.content || data.reply || (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content))) || '';
    if (!content) return { ok: false, error: t('aiErr') };
    return { ok: true, content: String(content) };
  } catch (e) {
    console.warn('callAI failed', e);
    return { ok: false, error: t('aiErr') + ': ' + (e && e.message ? e.message : String(e)) };
  }
}

function aiPlainLabel(role) {
  if (role === 'user') return t('aiYou');
  if (role === 'assistant') return t('aiBot');
  return 'system';
}

function aiConversationPlainText(msgs) {
  return (msgs || []).filter(m => m.role === 'user' || m.role === 'assistant')
    .map(m => aiPlainLabel(m.role) + '：' + String(m.content || '').replace(/\r\n/g, '\n'))
    .join('\n\n');
}

async function copyTextToClipboard(str) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(str);
      return true;
    }
  } catch (e) {}
  try {
    const ta = document.createElement('textarea');
    ta.value = str;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch (e) {
    return false;
  }
}

function downloadBlob(filename, blob) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function saveAiConversation(fmt) {
  ensureAiChat();
  const msgs = state.aiChat.messages || [];
  const model = getSelectedAiModel();
  const stamp = todayStr() + '-' + Date.now().toString(36);
  if (fmt === 'json') {
    const payload = {
      app: 'korean-site',
      type: 'ai-chat',
      exportedAt: new Date().toISOString(),
      model: model ? model.id : null,
      messages: msgs,
    };
    downloadBlob('ai-chat-' + stamp + '.json', new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' }));
  } else {
    const plain = aiConversationPlainText(msgs);
    downloadBlob('ai-chat-' + stamp + '.txt', new Blob([plain || ''], { type: 'text/plain;charset=utf-8' }));
  }
  toast(t('saved'));
}

        id: aiUid(), role: 'system', content: result.error || t('aiErr'),
        at: new Date().toISOString(), model: modelId,
      });
    }
    saveState();
    renderAI();

  if (input) {
    input.onkeydown = (ev) => {
      if (ev.key === 'Enter' && !ev.shiftKey) {
        ev.preventDefault();
        doSend();
      }
    };

    quiz = {
      queue: due.map(x => ({id: x.id, left: repeatsFor(x.id)})),
      index: 0, correct: 0, total: 0, mode: 'recognition', fromDue: true
    };
    showPanel('practice');
  };
}

/********************
 * Favorites (translate + AI)
 ********************/
function isAiFav(msgId) {
  return (state.aiFavorites || []).some(f => f.sourceId === msgId || f.id === msgId);
}
function toggleAiFavorite(msgId) {
  ensureAiChat();
  const msg = (state.aiChat.messages || []).find(m => m.id === msgId);
  if (!msg) return;
  if (!Array.isArray(state.aiFavorites)) state.aiFavorites = [];
  const idx = state.aiFavorites.findIndex(f => f.sourceId === msgId || f.id === msgId);
  if (idx >= 0) {
    state.aiFavorites.splice(idx, 1);
  } else {
    state.aiFavorites.push({
      id: 'aif_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
      sourceId: msg.id,
      role: msg.role,
      content: msg.content,
      at: new Date().toISOString(),
      model: msg.model || '',
    });
    toast(t('trFavSaved'));
  }
  saveState();
  renderAI();
}
function removeAiFavorite(fid) {
  state.aiFavorites = (state.aiFavorites || []).filter(f => f.id !== fid);
  saveState();
  renderFavorites();
}

function renderFavorites() {
  const el = document.getElementById('panel-favorites');
  const tr = state.translateFavorites || [];
  const ai = state.aiFavorites || [];
  let body = '';
  if (!tr.length && !ai.length) {
    body = '<div class="card empty">'+esc(t('favEmpty'))+'</div>';
  } else {
    if (tr.length) {
      body += '<div class="card"><h3>'+esc(t('favFromTranslate'))+'</h3></div>';
      body += tr.map(f =>
        '<div class="card">'
        +'<div class="muted">'+esc(t('favSource'))+': Translate · '+(f.from||'')+' → '+(f.to||'')+'</div>'
        +'<div class="ko-big" style="font-size:1.15rem;margin-top:4px">'+esc(f.original||'')+'</div>'
        +(f.translation ? '<div class="muted" style="margin-top:4px">'+esc(f.translation)+'</div>' : '')
        +(f.roma ? '<div class="tr-roma">'+esc(f.roma)+'</div>' : '')
        +'<div class="row" style="margin-top:8px">'
        +'<button type="button" class="btn secondary fav-copy" data-text="'+esc(f.original||'')+'">'+esc(t('trCopy'))+'</button>'
        +'<button type="button" class="btn ghost fav-del-tr" data-fid="'+esc(f.id)+'">'+esc(t('delete'))+'</button>'
        +'</div></div>'
      ).join('');
    }
    if (ai.length) {
      body += '<div class="card"><h3>'+esc(t('favFromAi'))+'</h3></div>';
      body += ai.map(f =>
        '<div class="card">'
        +'<div class="muted">'+esc(t('favSource'))+': AI · '+esc(f.role||'')+(f.model?' · '+esc(f.model):'')+'</div>'
        +'<div style="margin-top:6px;white-space:pre-wrap">'+esc(f.content||'')+'</div>'
        +'<div class="row" style="margin-top:8px">'
        +'<button type="button" class="btn secondary fav-copy" data-text="'+esc(f.content||'')+'">'+esc(t('trCopy'))+'</button>'
        +'<button type="button" class="btn ghost fav-del-ai" data-fid="'+esc(f.id)+'">'+esc(t('delete'))+'</button>'
        +'</div></div>'
      ).join('');
    }
  }
  el.innerHTML =
    '<div class="card"><h2>'+esc(t('favTitle'))+'</h2>'
    +'<p class="muted">'+esc(t('favHint'))+'</p></div>'
    + body;

  el.querySelectorAll('.fav-copy').forEach(b => {
    b.onclick = () => copyText(b.getAttribute('data-text') || '');
  });
  el.querySelectorAll('.fav-del-tr').forEach(b => {
    b.onclick = () => { removeFavorite(b.dataset.fid); renderFavorites(); };
  });
  el.querySelectorAll('.fav-del-ai').forEach(b => {
    b.onclick = () => removeAiFavorite(b.dataset.fid);
  });
}
